<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Great Limerick Run — Runners on Course</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L3C74246R6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-L3C74246R6');
  </script>
</head>
<body>

<div id="loading">Loading results…</div>

<div id="app">
  <header>
    <h1>Great Limerick Run — Runners on Course</h1>
    <p>Runners per 100m segment</p>
  </header>

  <div class="viz-row">
    <div id="map"></div>
    <div class="chart-wrap">
      <div id="chart"></div>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-line" style="background:#60a5fa"></div>
          <span>2025</span>
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background:#f97316"></div>
          <span>2026</span>
        </div>
        <div class="legend-item" style="margin-left:0.5rem; color:#475569; font-size:0.75rem;">
          <span>Dashed verticals = race start points (HM &amp; 6 Mile)</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="clock-display" id="clockDisplay">09:00</div>
  <div class="year-toggles" id="yearToggles">
    <label><input id="toggle2025" type="checkbox" checked onchange="toggleYear(2025)" /> 2025</label>
    <label><input id="toggle2026" type="checkbox" checked onchange="toggleYear(2026)" /> 2026</label>
  </div>
  <div class="slider-wrap">
    <input type="range" id="timeSlider" min="0" max="100" value="0" step="0.2" oninput="onSlider(this.value)" />
    <div class="slider-labels">
      <span id="sliderMin"></span>
      <span id="sliderMax"></span>
    </div>
  </div>
  <button class="play-btn" id="playBtn" onclick="togglePlay()">&#9654; Play</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
